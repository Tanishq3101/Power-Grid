[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false
# Only surfaces real type errors (e.g. passing str where int expected,
# calling a method that doesn't exist on a type) — not missing
# annotations or minor style issues.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
# What actually counts toward coverage — project source, not tests/config/tools.
source = ["env", "agents", "baselines", "evaluation", "training", "dashboard", "utils"]
omit = [
    "*/__pycache__/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Days 6-22 files are still NotImplementedError stubs (by design, per the
# blueprint) — don't let unreached lines in those inflate/deflate the number
# misleadingly. Real threshold enforcement happens in ci.yml once those fill in.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "def __repr__",
    "if TYPE_CHECKING:",
]