name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR makes the older run obsolete. Runs on main are
# never cancelled, so every merged commit gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    name: Test gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Standard library only; no dependency install needed.
      # 1. Every implemented module must have a test file with real tests.
      - name: Every implemented module has tests
        run: python .github/scripts/check_test_files.py

      # 2. Every day up to current_day has its own named tests, and none of
      #    them is skipped or xfailed.
      - name: Every day has tests
        if: github.event_name != 'pull_request'
        run: python .github/scripts/check_day_gates.py

      # 3. Same checks for pull requests, plus: no lowering current_day, no
      #    dropped day or required test, no removed or renamed test file, and
      #    no newly added skip/xfail marker anywhere in tests/.
      - name: Every day has tests and previous days are not weakened
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          python .github/scripts/check_day_gates.py --base-ref "origin/$BASE_REF"

          REMOVED=$(comm -23 \
            <(git ls-tree -r --name-only "origin/$BASE_REF" -- tests | grep -E 'test_.*\.py$' | sort) \
            <(git ls-tree -r --name-only HEAD -- tests | grep -E 'test_.*\.py$' | sort))
          if [ -n "$REMOVED" ]; then
            echo "::error::Test files removed or renamed in this PR:"
            echo "$REMOVED"
            exit 1
          fi

          if git diff "origin/$BASE_REF...HEAD" -- tests | grep -E '^\+.*(@(pytest\.)?mark\.(skip|xfail)|pytest\.(skip|xfail)\()'; then
            echo "::error::This PR adds a skip/xfail marker. Fix the failing test instead."
            exit 1
          fi

  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: flake8 (real bugs)
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics

      - name: black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: mypy
        run: mypy .

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest exits non-zero when no tests are collected, so an empty suite
      # cannot pass. The coverage floor (fail_under) lives in pyproject.toml.
      - name: Run full suite
        run: pytest tests/ --cov --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      # Catches every way of skipping at run time: markers, pytest.skip(),
      # importorskip and xfail all show up as <skipped> in the JUnit report.
      - name: No skipped or xfailed tests
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("junit.xml").getroot().iter("testcase"))
          skipped = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in cases
              if case.find("skipped") is not None
          ]
          if not cases:
              print("::error::No tests were collected.")
              sys.exit(1)
          if skipped:
              print("::error::Skipped or xfailed tests are not allowed:")
              print("\n".join(skipped))
              sys.exit(1)
          print(f"OK: {len(cases)} tests ran, none skipped.")
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gates, quality, tests]
    if: always()
    steps:
      # Single check name to require in branch protection.
      - name: Verify all required jobs succeeded
        run: |
          echo "gates=${{ needs.gates.result }} quality=${{ needs.quality.result }} tests=${{ needs.tests.result }}"
          [ "${{ needs.gates.result }}" = "success" ] && \
          [ "${{ needs.quality.result }}" = "success" ] && \
          [ "${{ needs.tests.result }}" = "success" ]