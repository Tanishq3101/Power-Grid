name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Test gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Standard library only; no dependency install needed.
      # 1. Every implemented module must have a test file with real tests.
      - name: Every implemented module has tests
        run: python .github/scripts/check_test_files.py

      # 2. Every day up to current_day must have its own named tests.
      - name: Every day has tests
        run: python .github/scripts/check_day_gates.py

      # 3. Pull requests may not lower current_day, drop a day, or remove a
      #    required test, and may not skip/xfail tests to hide a failure.
      - name: Previous days are not weakened
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          python .github/scripts/check_day_gates.py --base-ref origin/${{ github.base_ref }}

          REMOVED=$(comm -23 \
            <(git ls-tree -r --name-only origin/${{ github.base_ref }} -- tests | grep -E 'test_.*\.py$' | sort) \
            <(git ls-tree -r --name-only HEAD -- tests | grep -E 'test_.*\.py$' | sort))
          if [ -n "$REMOVED" ]; then
            echo "::error::Test files removed or renamed in this PR:"
            echo "$REMOVED"
            exit 1
          fi

          if git diff origin/${{ github.base_ref }}...HEAD -- tests | grep -E '^\+.*@pytest\.mark\.(skip|xfail)'; then
            echo "::error::This PR adds a skip/xfail marker. Fix the failing test instead."
            exit 1
          fi

  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: flake8 (real bugs)
        run: flake8 . --select=E9,F63,F7,F82 --show-source --statistics

      - name: black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: mypy
        run: mypy .

  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # pytest exits non-zero when no tests are collected, so an empty
      # suite cannot pass. Raise --cov-fail-under as Days 6-22 land.
      - name: Run full suite
        run: pytest tests/ --cov --cov-report=term-missing --cov-fail-under=40

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [gates, quality, tests]
    if: always()
    steps:
      # Single check name to require in branch protection.
      - name: Verify all required jobs succeeded
        run: |
          echo "gates=${{ needs.gates.result }} quality=${{ needs.quality.result }} tests=${{ needs.tests.result }}"
          [ "${{ needs.gates.result }}" = "success" ] && \
          [ "${{ needs.quality.result }}" = "success" ] && \
          [ "${{ needs.tests.result }}" = "success" ]